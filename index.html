/* ---------- markdown (safe, minimal) ---------- */
function md(src){
  const blocks=[];
  let s=String(src).replace(/```([\w+#.-]*)[^\S\n]*\n([\s\S]*?)(```|$)/g,(m,l,c)=>{
    CODE.push({l:l||'',c:c.replace(/\n$/,'')});blocks.push(CODE.length-1);return '\u0000'+(CODE.length-1)+'\u0000';
  });
  s=esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=null,para=[];
  const flushP=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}};
  const flushL=()=>{if(list){out.push('</'+list+'>');list=null}};
  for(const ln of s.split('\n')){
    let m;
    if((m=ln.match(/^\s*\u0000(\d+)\u0000\s*$/))){flushP();flushL();out.push(codeHtml(+m[1]));}
    else if((m=ln.match(/^(#{1,4})\s+(.*)$/))){flushP();flushL();out.push(`<h4>${m[2]}</h4>`);}
    else if((m=ln.match(/^\s*(?:[-*•])\s+(.*)$/))){flushP();if(list!=='ul'){flushL();out.push('<ul>');list='ul'}out.push('<li>'+m[1]+'</li>');}
    else if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(list!=='ol'){flushL();out.push('<ol>');list='ol'}out.push('<li>'+m[1]+'</li>');}
    else if(!ln.trim()){flushP();flushL();}
    else{flushL();para.push(ln);}
  }
  flushP();flushL();
  return out.join('').replace(/\u0000(\d+)\u0000/g,(m,i)=>codeHtml(+i));
}
function codeHtml(i){
  const b=CODE[i];if(!b)return '';
  return `<div class="pj-code"><div class="pj-code-h"><span>${esc(b.l||'код')}</span><span><button data-act="copycode" data-i="${i}">Көшіру</button><button data-act="savecode" data-i="${i}">Файлға сақтау</button></span></div><pre><code>${esc(b.c)}</code></pre></div>`;
}

/* ---------- AI request ---------- */
function context(p){
  const L=[`Сен QWQ-сің. Қолданушы қазір «${p.name}» жобасында жұмыс істеп жатыр. Жауапты қазақ тілінде бер (қолданушы анық басқа тілде сөйлемесе).`];
  if(p.files.length)L.push('Жоба файлдары: '+p.files.map(f=>f.name).join(', ')+'.');
  let budget=60000;
  for(const f of p.files){
    if(f.text==null||budget<=0)continue;
    const t=f.text.slice(0,Math.min(20000,budget));budget-=t.length;
    L.push(`\n--- Файл: ${f.name}${t.length<f.text.length?' (қысқартылған)':''} ---\n${t}\n--- Файл соңы ---`);
  }
  return L.join('\n');
}
async function ask(p,text,history,onDelta,signal){
  const c=cfg();
  if(!c.key)throw new Error('Кіру коды жоқ. Баптаулар ішінде «Кіру коды» өрісін толтыр.');
  const hist=[{role:'system',content:context(p)},...history];
  let r;
  try{
    r=await fetch(c.server+'/api/chat',{method:'POST',signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.key},
      body:JSON.stringify({message:text,history:hist,user:userId(),web:false,stream:true,model:c.model&&c.model!=='auto'?c.model:undefined})});
  }catch(e){if(e&&e.name==='AbortError')throw e;throw new Error('Желі қатесі. Байланысты тексер.')}
  if(!r.ok){
    let d={};try{d=await r.json()}catch{}
    const det=String((d.error&&d.error.message)||d.error||'').slice(0,200);
    throw new Error(r.status===401||r.status===403?'Кіру коды дұрыс емес.':r.status===429?'Сұрау тым көп, сәл күте тұр.':'Сервер қатесі'+(det?': '+det:''));
  }
  if((r.headers.get('content-type')||'').includes('application/json')){
    const d=await r.json();if(d.answer)onDelta(d.answer);return d.answer||'';
  }
  const rd=r.body.getReader(),dec=new TextDecoder();
  let buf='',full='',err=null,done=false;
  const feed=chunk=>{
    buf+=chunk.replace(/\r\n/g,'\n');let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const blk=buf.slice(0,i);buf=buf.slice(i+2);
      const d=blk.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).replace(/^ /,'')).join('\n');
      if(!d||d==='[DONE]')continue;
      try{const j=JSON.parse(d);
        if(j.type==='delta'){full+=j.text;onDelta(j.text)}else if(j.type==='error')err=j;else if(j.type==='done')done=true;
      }catch{}
    }
  };
  try{for(;;){const{done:dn,value}=await rd.read();if(dn)break;feed(dec.decode(value,{stream:true}));if(err)break}}
  catch(e){if(e&&e.name==='AbortError')throw e;throw new Error('Байланыс үзілді.')}
  if(err)throw new Error(String(err.error||'Сервер қатесі'));
  if(!done&&!full)throw new Error('Жауап толық келмеді.');
  return full;
}

}
const sorted=()=>projects.sort((a,b)=>b.updated-a.updated);

/* ---------- views ---------- */
const ICON_CLOSE='←';
function openOverlay(){
  if(ov){return}
  ov=document.createElement('div');ov.id='pj-ov';document.body.appendChild(ov);
  ov.addEventListener('click',onClick);
  ov.addEventListener('keydown',onKey);
  dbAll().then(a=>{projects=a||[];if(ov)render()}).catch(()=>{toast('Деректер базасы ашылмады');render()});
  cur=null;tab='chat';render();
}
function closeOverlay(){
  if(!ov)return;
  if(busy&&ctl)ctl.abort();
  ov.remove();ov=null;cur=null;
}
function render(){
  if(!ov)return;
  if(cur)renderDetail();else renderList();
}
function renderList(){
  const list=sorted();
  ov.innerHTML=`<div class="pj-wrap">
   <div class="pj-top"><button class="pj-ib" data-act="close" aria-label="Жабу">${ICON_CLOSE}</button><h1>📁 Жобалар</h1><button class="pj-ib" data-act="help" aria-label="Түсіндірме" title="Түсіндірме">?</button></div>
   <div class="pj-body"><button class="pj-new" data-act="new">＋ Жаңа жоба</button>
   ${list.length?list.map(p=>`<div class="pj-card" data-act="open" data-id="${p.id}"><span class="pj-ic">📁</span>
     <div class="pj-ci"><b>${esc(p.name)}</b><small>${p.messages.filter(m=>m.role==='user').length} сұрау · ${p.files.length} файл · ${fmtDate(p.updated)}</small></div>
     <button class="pj-ib" data-act="ren" data-id="${p.id}" aria-label="Атын өзгерту" title="Атын өзгерту">✎</button>
     <button class="pj-ib danger" data-act="del" data-id="${p.id}" aria-label="Өшіру" title="Өшіру">🗑</button></div>`).join('')
   :`<div class="pj-empty"><div class="big">📁</div>Жоба жоқ.<br>Жаңа жоба ашып, жұмысты бір жерде жүргіз.</div>`}
   </div></div>`;
}
function renderDetail(){
  const p=cur;
  ov.innerHTML=`<div class="pj-wrap">
   <div class="pj-top"><button class="pj-ib" data-act="back" aria-label="Артқа">${ICON_CLOSE}</button><h1>${esc(p.name)}</h1>
    <button class="pj-ib" data-act="ren" data-id="${p.id}" aria-label="Атын өзгерту" title="Атын өзгерту">✎</button>
    <button class="pj-ib danger" data-act="del" data-id="${p.id}" aria-label="Өшіру" title="Өшіру">🗑</button>
    <button class="pj-ib" data-act="help" aria-label="Түсіндірме" title="Түсіндірме">?</button></div>
   <div class="pj-tabs"><button class="pj-tab ${tab==='chat'?'on':''}" data-act="tab" data-t="chat">💬 Чат</button><button class="pj-tab ${tab==='files'?'on':''}" data-act="tab" data-t="files">📂 Файлдар (${p.files.length})</button></div>
   ${tab==='chat'?`<div class="pj-msgs" id="pj-msgs"></div>
    <div class="pj-comp"><textarea id="pj-in" rows="1" placeholder="Жоба ішінде тапсырма жаз…" aria-label="Тапсырма"></textarea>
    <button class="pj-send" id="pj-send" data-act="send" aria-label="Жіберу">➤</button></div>`
   :`<div class="pj-body" id="pj-files"></div>`}
  </div>`;
  if(tab==='chat'){renderMsgs(true);setSendBtn();const ta=$('#pj-in');ta.addEventListener('input',autosize);}
  else renderFiles();
}
function autosize(){const t=$('#pj-in');if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
function setSendBtn(){const b=$('#pj-send');if(!b)return;b.textContent=busy?'■':'➤';b.setAttribute('aria-label',busy?'Тоқтату':'Жіберу');b.dataset.act=busy?'stop':'send'}
function renderMsgs(force){
  const box=$('#pj-msgs');if(!box||!cur)return;
  const near=force||box.scrollHeight-box.scrollTop-box.clientHeight<120;
  CODE=[];
  if(!cur.messages.length){
    box.innerHTML=`<div class="pj-empty"><div class="big">💬</div><b>${esc(cur.name)}</b><br>Тапсырма жаз. QWQ жоба атауы мен мәтіндік файлдарын ескереді${cur.files.length?` (${cur.files.length} файл)`:''}.</div>`;
    return;
  }
  box.innerHTML=cur.messages.map((m,i)=>{
    if(m.role==='user')return `<div class="pj-m u"><div class="pj-bub">${esc(m.content)}</div></div>`;
    const body=m.content?md(m.content):(m.pending?'<span class="pj-dots"><i></i><i></i><i></i></span>':'');
    return `<div class="pj-m a"><div class="pj-bub">${body}</div>${m.error?`<div class="pj-err">⚠ ${esc(m.error)}</div>`:''}
      ${m.content&&!m.pending?`<div class="pj-acts"><button data-act="copymsg" data-i="${i}">Көшіру</button><button data-act="savemsg" data-i="${i}">Жобаға сақтау</button></div>`:''}</div>`;
  }).join('');
  if(near)box.scrollTop=box.scrollHeight;
}
function renderFiles(){
  const box=$('#pj-files');if(!box||!cur)return;
  const fs=cur.files.slice().sort((a,b)=>b.created-a.created);
  box.innerHTML=`<button class="pj-up" data-act="upload">⬆ Файл жүктеу</button>
   <input type="file" id="pj-fin" multiple hidden>
   <p class="pj-note">Мәтіндік және кодтық файлдардың мазмұны жоба чатындағы келесі тапсырмаларға беріледі. Басқа файлдар тек сақталады (әр файл ${MAX_FILE/1048576} МБ-қа дейін).</p>
   ${fs.length?fs.map(f=>`<div class="pj-file"><span class="pj-ic">${f.text!=null?'📄':'📎'}</span>
     <div class="pj-ci"><b>${esc(f.name)}</b><small>${fmtSize(f.size)} · ${fmtDate(f.created)}${f.text!=null?' · AI-ға беріледі':''}</small></div>
     <button class="pj-ib" data-act="dl" data-id="${f.id}" aria-label="Жүктеп алу" title="Жүктеп алу">⬇</button>
     <button class="pj-ib danger" data-act="delfile" data-id="${f.id}" aria-label="Өшіру" title="Өшіру">🗑</button></div>`).join('')
   :`<div class="pj-empty"><div class="big">📂</div>Файл жоқ.<br>Жобаға файл жүкте.</div>`}`;
  $('#pj-fin').addEventListener('change',async e=>{const l=[...e.target.files];e.target.value='';await addFiles(l)});
}

/* ---------- actions ---------- */
async function addFiles(list){
  if(!cur)return;
  const p=cur;let n=0;
  for(const f of list){
    if(f.size>MAX_FILE){toast(`«${f.name}» тым үлкен (${MAX_FILE/1048576} МБ-тан аспауы керек)`);continue}
    let text=null;
    if(isText(f)){try{text=await f.text()}catch{}}
    const ex=p.files.findIndex(x=>x.name===f.name);
    const rec={id:uid('f'),name:f.name,type:f.type||'',size:f.size,created:Date.now(),text,blob:f};
    if(ex>=0)p.files[ex]=rec;else p.files.push(rec);
    n++;
  }
  if(n){await save(p);toast(n+' файл жүктелді')}
  if(cur===p&&tab==='files')renderDetail();
}
async function saveText(p,name,text){
  const nm=uniqueName(p,name);
  p.files.push({id:uid('f'),name:nm,type:'text/plain',size:new Blob([text]).size,created:Date.now(),text,blob:new Blob([text],{type:'text/plain'})});
  await save(p);toast('Жобаға сақталды: '+nm);
  if(cur===p&&tab==='files')renderDetail();else if(cur===p){const b=$('.pj-tab[data-t="files"]');if(b)b.textContent=`📂 Файлдар (${p.files.length})`}
}
let rt=null;
const schedRender=()=>{if(rt)return;rt=setTimeout(()=>{rt=null;if(cur&&tab==='chat')renderMsgs()},60)};
async function send(){
  if(busy||!cur)return;
  const ta=$('#pj-in');const text=ta.value.trim();if(!text)return;
  const p=cur;
  const hist=p.messages.filter(m=>!m.error&&m.content).slice(-20).map(m=>({role:m.role,content:m.content}));
  const um={id:uid('m'),role:'user',content:text,created:Date.now()};
  const am={id:uid('m'),role:'assistant',content:'',created:Date.now(),pending:true};
  p.messages.push(um,am);ta.value='';autosize();
  busy=true;ctl=new AbortController();setSendBtn();renderMsgs(true);
  let failed=null;
  try{await ask(p,text,hist,d=>{am.content+=d;if(cur===p)schedRender()},ctl.signal)}
  catch(e){failed=e}
  delete am.pending;busy=false;ctl=null;
  if(failed){
    const aborted=failed.name==='AbortError';
    if(!am.content){
      p.messages.splice(p.messages.indexOf(um),2);
      if(cur===p&&$('#pj-in')){$('#pj-in').value=text;autosize()}
      if(!aborted)toast(failed.message||'Қате');
    }else if(!aborted)am.error=failed.message||'Қате';
  }
  await save(p);
  if(cur===p&&tab==='chat'){setSendBtn();renderMsgs(true)}
}

async function onClick(e){
  const el=e.target.closest('[data-act]');if(!el||!ov.contains(el))return;
  const a=el.dataset.act,id=el.dataset.id;
  const pr=id&&projects.find(x=>x.id===id);
  switch(a){
    case 'close':closeOverlay();break;
    case 'help':showHelp();break;
    case 'back':if(busy&&ctl)ctl.abort();cur=null;render();break;
    case 'new':{
      const name=await dlg({title:'Жаңа жоба',text:'Жобаға атау бер.',input:'',ok:'Ашу'});
      if(!name)break;
      const p={id:uid('p'),name,created:Date.now(),updated:Date.now(),messages:[],files:[]};
      projects.push(p);await save(p);cur=p;tab='chat';render();break;
    }
    case 'open':if(pr){cur=pr;tab='chat';render()}break;
    case 'ren':{
      if(!pr)break;
      const name=await dlg({title:'Атын өзгерту',input:pr.name,ok:'Сақтау'});
      if(!name)break;pr.name=name;await save(pr);render();break;
    }
    case 'del':{
      if(!pr)break;
      const ok=await dlg({title:'Жобаны өшіру',text:`«${pr.name}» жобасы, оның чаты мен файлдары өшіріледі. Қайтару мүмкін емес.`,ok:'Өшіру',danger:true});
      if(!ok)break;
      if(cur===pr&&busy&&ctl)ctl.abort();
      projects=projects.filter(x=>x!==pr);try{await dbDel(pr.id)}catch{toast('Өшіру қатесі')}
      cur=null;render();toast('Жоба өшірілді');break;
    }
    case 'tab':tab=el.dataset.t;renderDetail();break;
    case 'send':send();break;
    case 'stop':if(ctl)ctl.abort();break;
    case 'copymsg':{const m=cur&&cur.messages[+el.dataset.i];if(m)toast(await copy(m.content)?'Көшірілді':'Көшіру мүмкін болмады');break}
    case 'savemsg':{
      const m=cur&&cur.messages[+el.dataset.i];if(!m)break;
      const d=new Date(m.created||Date.now()),z=n=>String(n).padStart(2,'0');
      await saveText(cur,`жауап-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.md`,m.content);break;
    }
    case 'copycode':{const b=CODE[+el.dataset.i];if(b)toast(await copy(b.c)?'Код көшірілді':'Көшіру мүмкін болмады');break}
    case 'savecode':{
      const b=CODE[+el.dataset.i];if(!b||!cur)break;
      const ext=EXT[(b.l||'').toLowerCase()]||'txt';
      const name=await dlg({title:'Файл ретінде сақтау',text:'Файл атауы:',input:'kod.'+ext,ok:'Сақтау'});
      if(name)await saveText(cur,name,b.c);break;
    }
    case 'upload':{const i=$('#pj-fin');if(i)i.click();break}
    case 'dl':{const f=cur&&cur.files.find(x=>x.id===id);if(f)download(f.blob||new Blob([f.text||'']),f.name);break}
    case 'delfile':{
      const f=cur&&cur.files.find(x=>x.id===id);if(!f)break;
      const ok=await dlg({title:'Файлды өшіру',text:`«${f.name}» жобадан өшіріледі.`,ok:'Өшіру',danger:true});
      if(!ok)break;cur.files=cur.files.filter(x=>x!==f);await save(cur);renderDetail();break;
    }
  }
}
function onKey(e){
  if(e.target.id==='pj-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    const coarse=matchMedia('(pointer:coarse)').matches;
    if(cfg().enterSends&&!coarse){e.preventDefault();send()}
  }
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('.pj-mod'))return;
  if(ov)closeOverlay();
});

/* ---------- sidebar integration ---------- */
const FOLDER='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function inject(){
  document.querySelectorAll('div.px-3').forEach(box=>{
    if(box.querySelector('[data-pj]'))return;
    const bs=box.querySelectorAll(':scope>button');
    if(bs.length<3||!/QWQ/.test(bs[0].textContent))return;
    const row=document.createElement('div');row.className='pj-sb';row.setAttribute('data-pj','1');
    row.innerHTML=`<button class="main" data-pj-open>${FOLDER}<span>Жобалар</span></button><button class="q" data-pj-help aria-label="Түсіндірме" title="Түсіндірме">?</button>`;
    row.addEventListener('click',e=>{
      if(e.target.closest('[data-pj-help]')){showHelp();return}
      if(e.target.closest('[data-pj-open]'))openOverlay();
    });
    box.appendChild(row);
  });
}
let it=null;
new MutationObserver(()=>{clearTimeout(it);it=setTimeout(inject,60)}).observe(document.documentElement,{childList:true,subtree:true});
inject();

/* ---------- first-run help ---------- */
setTimeout(()=>{let seen=false;try{seen=!!localStorage.getItem(HELP_FLAG)}catch{}if(!seen)showHelp()},2200);
})();

</script>
</body>
</html>
